{% load patasegura %}{% if mascota.foto and not mascota.foto_oculta %}<img class="foto-mascota {{ tam }}" src="{{ mascota.foto.url }}" alt="Foto de {{ mascota.nombre|default:'la mascota' }}">{% else %}<div class="foto-mascota {{ tam }} sin-foto sin-foto-{{ mascota.especie }}" role="img" aria-label="{{ mascota.get_especie_display }} sin foto">{{ mascota.especie|emoji_especie }}{% if mascota.foto_oculta %}<small class="foto-revision">Foto en revisión</small>{% endif %}</div>{% endif %}
