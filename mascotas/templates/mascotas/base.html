{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}PataSegura{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'mascotas/estilos.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="{% url 'inicio' %}" class="logo">🐾 PataSegura</a>
        <nav>
            <a href="{% url 'lista_mascotas_perdidas' %}">Mascotas perdidas</a>
            <a href="{% url 'lista_establecimientos' %}">Veterinarias y refugios</a>
            <a href="{% url 'lista_adopciones' %}">Adopciones</a>
        </nav>
        <div class="user-area">
            {% if user.is_authenticated %}
                <a href="{% url 'mi_cuenta' %}" class="avatar" title="Mi cuenta">{{ user.username|first|upper }}</a>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                <a href="{% url 'registro' %}" class="btn-primary">Crear cuenta</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block contenido %}{% endblock %}
    </main>

    <script src="{% static 'mascotas/main.js' %}"></script>
</body>
</html>
